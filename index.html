<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws Memory Game</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/paw-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="app" id="app-id">
    <header class="game-header">
      <div class="container">
        <div class="game-brand">
          <img src="assets/logo.svg" alt="Paw logo" />
        </div>
        <div class="player-info">
          Hello <span id="player-name" class="clickable-name"></span>
        </div>

        <div class="game-stats">
          <div class="stat-box">
            <div>Moves</div>
            <p id="moves">0</p>
          </div>

          <div class="timer stat-box">
            <div>Time</div>
            <p id="time">00:00</p>
          </div>
        </div>
      </div>
    </header>
    <main class="game-container">
      <section
        class="game-board"
        aria-label="Memory card game"
        id="board"
      ></section>

      <div class="game-controls">
        <button id="restart-button" type="button" class="btn">Restart</button>
      </div>
    </main>

    <div id="welcome-modal" class="modal-overlay">
      <div id="modal-div">
        <a class="close-btn" href="#"
          ><img id="close-welcome-btn" src="assets/icons/close_circle.svg"
        /></a>
        <div id="modal-header">
          <img id="modal-header-logo" src="assets/modal-logo.svg" />
          <p id="modal-header-p">
            Find the pairs of cards with the same image.
          </p>
        </div>

        <div>
          <form id="modal-form">
            <div id="label-icon">
              <label id="label-name">Enter your name:</label>
              <a href="#"
                ><div class="tooltip">
                  <img src="assets/icons/question-mark-circle.svg" alt="Help" />
                  <span class="tooltip-text">
                    Enter your name to save your progress and track your best
                    scores.
                  </span>
                </div>
              </a>
            </div>
            <input id="player-input" type="text" />
            <button type="submit" class="btn">Submit</button>
          </form>
        </div>
      </div>
    </div>
    <div id="success-modal" class="modal-overlay">
      <div id="modal-div">
        <a id="close-success-modal" class="close-btn" href="#">
          <img id="close-success-modal" src="assets/icons/close_circle.svg" />
        </a>
        <div id="modal-header">
          <img id="modal-header-logo" src="assets/modal-logo.svg" />
          <!-- <p id="modal-header-p">Congratulations! You matched all the cards</p> -->
          <p id="success-modal-header-p"></p>
          <p id="modal-sub-p"></p>
        </div>
        <section class="results">
          <div class="results-heading">
            <span></span>
            <strong>CURRENT</strong>
            <span class="best-heading">
              <span class="crown">
                <img class="crown" src="assets/icons/crown.svg" />
              </span>
              BEST
            </span>
          </div>
          <div class="result-row">
            <div>
              <img class="result-icon" src="assets/icons/move-icon.svg" />
            </div>
            <strong>MOVES</strong>
            <span id="success-moves">20</span>
            <span id="best-moves">12</span>
            <span>
              <img class="trophy" src="assets/icons/throphy.svg" />
            </span>
          </div>
          <div class="result-row">
            <img class="stat-icon" src="assets/icons/clock.svg" />
            <strong class="stat-title">TIME</strong>
            <span id="success-time" class="stat-value">0</span>
            <span id="best-time">00:10</span>
          </div>
        </section>
        <a
          class="btn-restart"
          id="play-again-btn"
          aria-label="Play again"
          href="#"
        >
          <img src="assets/icons/button.svg" />
        </a>
      </div>
    </div>
  </body>
</html>
