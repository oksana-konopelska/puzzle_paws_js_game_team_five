<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws Memory Game</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/paw-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="app" id="app-id">
    <header class="game-header">
      <div class="container">
        <div class="game-brand">
          <img src="assets/logo.svg" alt="Paw logo" />
        </div>
        <div class="player-info">
          Hello <span id="player-name" class="clickable-name"></span>
        </div>

        <div class="game-stats">
          <div class="stat-box">
            <div>Moves</div>
            <p id="moves">0</p>
          </div>

          <div class="timer stat-box">
            <div>Time</div>
            <p id="time">00:00</p>
          </div>
        </div>
      </div>
    </header>
    <main class="game-container">
      <section
        class="game-board"
        aria-label="Memory card game"
        id="board"
      ></section>

      <div class="game-controls">
        <button id="restart-button" type="button" class="btn">Restart</button>
      </div>
    </main>

    <div id="welcome-modal" class="modal-overlay">
      <div class="modal-div">
        <button class="close-btn" id="close-welcome-btn">
          <img src="assets/icons/close_circle.svg" alt="Close modal" />
        </button>
        <div class="modal-header">
          <img
            class="modal-header-logo"
            src="assets/modal-logo.svg"
            alt="logo"
          />
          <p class="modal-header-p">
            Find the pairs of cards with the same image.
          </p>
        </div>

        <div>
          <form id="modal-form" class="modal-form">
            <div class="label-icon">
              <label id="label-name">Enter your name:</label>
              <div class="tooltip">
                <img src="assets/icons/question-mark-circle.svg" alt="Help" />
                <span class="tooltip-text">
                  Enter your name to save your progress and track your best
                  scores.
                </span>
              </div>
            </div>
            <input id="player-input" type="text" />
            <button type="submit" class="btn">Submit</button>
          </form>
        </div>
      </div>
    </div>

    <div id="success-modal" class="modal-overlay">
      <div class="modal-div">
        <button id="close-success-modal" class="close-btn">
          <img src="assets/icons/close_circle.svg" alt="Close modal" />
        </button>
        <div class="modal-header">
          <img id="modal-header-logo" src="assets/modal-logo.svg" />
          <p id="success-modal-header-p"></p>
          <p id="modal-sub-p">You matched all the cards</p>
        </div>
        <section class="results">
          <div class="results-heading">
            <span></span>
            <strong>CURRENT</strong>
            <span class="best-heading">
              <span class="crown">
                <img
                  class="crown"
                  src="assets/icons/crown.svg"
                  alt="Crown icon"
                />
              </span>
              BEST
            </span>
          </div>
          <div class="result-row">
            <div>
              <img
                class="result-icon"
                src="assets/icons/move-icon.svg"
                alt="Move icon"
              />
            </div>
            <strong>MOVES</strong>
            <span id="success-moves">20</span>
            <span id="best-moves">12</span>
            <span>
              <img
                class="trophy"
                src="assets/icons/throphy.svg"
                alt="Trophy icon"
              />
            </span>
          </div>
          <div class="result-row">
            <img
              class="stat-icon"
              src="assets/icons/clock.svg"
              alt="Clock icon"
            />
            <strong class="stat-title">TIME</strong>
            <span id="success-time" class="stat-value">0</span>
            <span id="best-time">00:10</span>
          </div>
        </section>
        <button class="btn-restart" id="play-again-btn" aria-label="Play again">
          <img src="assets/icons/button.svg" alt="Restart" />
        </button>
      </div>
    </div>
  </body>
</html>
