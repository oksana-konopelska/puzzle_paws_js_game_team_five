<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws Memory Game</title>
    <link rel="icon" type="image/x-icon" href="/assets/icons/paw-icon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="app" id="app-id">
    <header class="game-header">
      <div class="container">
        <div class="game-brand">
          <img src="assets/logo.svg" alt="Paw logo" />
        </div>

        <div class="player-info">
          Hello <span id="player-name" class="clickable-name"></span>
        </div>

        <div class="game-stats">
          <div class="stat-box">
            <div>Moves</div>
            <p id="moves">0</p>
          </div>

          <div class="timer stat-box">
            <div>Time</div>
            <p id="time" onclick="stopTimer()">00:00</p>
          </div>
        </div>
      </div>
    </header>
    <main class="game-container">
      <section
        class="game-board"
        aria-label="Memory card game"
        id="board"
      ></section>

      <div class="game-controls">
        <button id="restart-button" type="button" class="btn">Restart</button>
      </div>
    </main>
    <!-- welcome modal -->
    <div id="welcome-modal" class="modal-overlay">
      <div id="modal-div">
        <a class="close-btn" href="#"
          ><img id="close-welcome-btn" src="assets/icons/close_circle.svg"
        /></a>
        <div id="modal-header">
          <img id="modal-header-logo" src="assets/modal-logo.svg" />
          <p id="modal-header-p">
            Find the pairs of cards with the same image.
          </p>
        </div>

        <div>
          <form id="modal-form">
            <div id="label-icon">
              <label id="label-name">Enter your name:</label>
              <a href="#"
                ><div class="tooltip">
                  <img src="assets/icons/question-mark-circle.svg" alt="Help" />
                  <span class="tooltip-text">
                    Enter your name to save your progress and track your best
                    scores.
                  </span>
                </div>
              </a>
            </div>
            <input id="player-input" type="text" autofocus />
            <button type="submit" class="btn">Submit</button>
          </form>
        </div>
      </div>
    </div>
    <div id="success-modal" class="modal-overlay">
      <div id="modal-div">
        <a id="close-success-modal" class="close-btn" href="#">
          ><img src="assets/icons/close_circle.svg" />
        </a>
        <div id="modal-header">
          <img id="modal-header-logo" src="assets/paw-signin.svg" />
          <p id="modal-header-p">Congratulations! You matched all the cards</p>
          <p id="modal-sub-p">Good work, Ana</p>
        </div>

        <!-- Stats Section -->
        <div id="modal-stats">
          <div class="stat-card">
            <img class="stat-icon" src="assets/icons/paw-icon.svg" alt="paw" />
            <span class="stat-title">MOVES</span>
            <span class="stat-value">24</span>
          </div>
          <div class="stat-card">
            <img class="stat-icon" src="assets/icons/paw-icon.svg" alt="paw" />
            <span class="stat-title">BEST MOVES</span>
            <span class="stat-value" id="best-moves">24</span>
          </div>
          <div class="stat-card">
            <img class="stat-icon" src="assets/icons/paw-icon.svg" alt="paw" />
            <span class="stat-title">CURRENT TIME</span>
            <span class="stat-value">0:47</span>
          </div>
          <div class="stat-card">
            <img class="stat-icon" src="assets/icons/paw-icon.svg" alt="paw" />
            <span class="stat-title">BEST TIME</span>
            <span class="stat-value" id="best-time">0:20</span>
          </div>
        </div>

        <div>
          <button class="btn">Play again</button>
        </div>
      </div>
    </div>
  </body>
</html>
